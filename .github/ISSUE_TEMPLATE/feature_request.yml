name: Permintaan Fitur
description: Usulkan ide atau fitur baru untuk OCR Service
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Terima kasih atas usulan fitur baru Anda!
  - type: textarea
    id: kebutuhan
    attributes:
      label: Kebutuhan / Masalah yang Diselesaikan
      description: Apa masalah yang ingin diselesaikan dengan fitur ini?
    validations:
      required: true
  - type: textarea
    id: solusi
    attributes:
      label: Usulan Solusi
      description: Jelaskan bagaimana fitur ini sebaiknya bekerja.
    validations:
      required: true
  - type: textarea
    id: alternatif
    attributes:
      label: Alternatif yang Dipertimbangkan
      description: Apakah ada pendekatan atau pustaka lain yang pernah Anda coba?
