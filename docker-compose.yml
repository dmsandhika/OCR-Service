services:
  ocr-service:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - TESSDATA_CACHE_PATH=/app/.cache/tesseract
    volumes:
      - tessdata-cache:/app/.cache/tesseract
      - ./config/api-keys.json:/app/config/api-keys.json:ro
    restart: unless-stopped

volumes:
  tessdata-cache:
